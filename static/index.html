<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SlimClaw</title>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Outfit:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0d1117;
      --surface: #161b22;
      --border: #30363d;
      --text: #e6edf3;
      --text-muted: #8b949e;
      --accent: #58a6ff;
      --accent-dim: #388bfd66;
      --user-bg: #21262d;
      --success: #3fb950;
      --warning: #d29922;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }

    body {
      font-family: 'Outfit', system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    header {
      padding: 1rem 1.5rem;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }
    header h1 {
      font-size: 1.25rem;
      font-weight: 600;
      color: var(--accent);
      font-family: 'JetBrains Mono', monospace;
    }
    header span {
      font-size: 0.75rem;
      color: var(--text-muted);
      font-weight: 400;
    }

    #messages {
      flex: 1;
      overflow-y: auto;
      padding: 1.5rem;
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    .msg {
      max-width: 80%;
      padding: 1rem 1.25rem;
      border-radius: 12px;
      line-height: 1.6;
      animation: fadeIn 0.2s ease;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(4px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .msg.user {
      align-self: flex-end;
      background: var(--user-bg);
      border: 1px solid var(--border);
    }

    .msg.assistant {
      align-self: flex-start;
      background: var(--surface);
      border: 1px solid var(--border);
    }

    .msg.assistant .content {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.9rem;
      white-space: pre-wrap;
      word-break: break-word;
    }
    .msg.assistant .content h1, .msg.assistant .content h2, .msg.assistant .content h3 {
      margin-top: 0.5em;
      margin-bottom: 0.25em;
    }
    .msg.assistant .content pre {
      background: var(--bg);
      padding: 1rem;
      border-radius: 8px;
      overflow-x: auto;
      margin: 0.5em 0;
    }
    .msg.assistant .content code {
      font-size: 0.85em;
    }
    .msg.assistant .content p { margin: 0.5em 0; }
    .msg.assistant .content ul, .msg.assistant .content ol { margin-left: 1.25em; }

    .msg .role {
      font-size: 0.7rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--text-muted);
      margin-bottom: 0.35rem;
    }

    .thinking {
      align-self: flex-start;
      padding: 1rem 1.25rem;
      background: var(--surface);
      border: 1px dashed var(--border);
      border-radius: 12px;
      color: var(--text-muted);
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }
    .thinking .dot { animation: pulse 1.2s infinite; }
    .thinking .dot:nth-child(2) { animation-delay: 0.2s; }
    .thinking .dot:nth-child(3) { animation-delay: 0.4s; }
    @keyframes pulse {
      0%, 100% { opacity: 0.3; }
      50% { opacity: 1; }
    }

    .shell-confirm {
      align-self: flex-start;
      padding: 1rem 1.25rem;
      background: var(--surface);
      border: 1px solid var(--warning);
      border-radius: 12px;
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }
    .shell-confirm-text {
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }
    .shell-confirm span { color: var(--warning); }
    .shell-confirm .shell-cmd {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.85rem;
      background: var(--bg);
      padding: 0.5rem 0.75rem;
      border-radius: 6px;
      color: var(--text);
      word-break: break-all;
    }
    .shell-confirm button {
      font-family: 'JetBrains Mono', monospace;
      padding: 0.4rem 0.9rem;
      border-radius: 6px;
      border: 1px solid var(--border);
      background: var(--bg);
      color: var(--text);
      cursor: pointer;
      font-size: 0.85rem;
      transition: background 0.15s, border-color 0.15s;
    }
    .shell-confirm button:hover {
      background: var(--user-bg);
      border-color: var(--accent);
    }
    .shell-confirm button.allow {
      border-color: var(--success);
      color: var(--success);
    }
    .shell-confirm button.allow:hover { background: rgba(63, 185, 80, 0.15); }

    #input-area {
      padding: 1rem 1.5rem;
      border-top: 1px solid var(--border);
      display: flex;
      gap: 0.75rem;
      align-items: flex-end;
    }

    #input {
      flex: 1;
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.95rem;
      padding: 0.9rem 1.2rem;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      color: var(--text);
      resize: none;
      min-height: 48px;
      max-height: 160px;
      transition: border-color 0.15s;
    }
    #input:focus {
      outline: none;
      border-color: var(--accent);
      box-shadow: 0 0 0 2px var(--accent-dim);
    }
    #input::placeholder { color: var(--text-muted); }

    #send {
      font-family: 'JetBrains Mono', monospace;
      padding: 0.9rem 1.4rem;
      background: var(--accent);
      color: var(--bg);
      border: none;
      border-radius: 10px;
      font-weight: 600;
      cursor: pointer;
      font-size: 0.9rem;
      transition: filter 0.15s, transform 0.1s;
    }
    #send:hover { filter: brightness(1.1); }
    #send:active { transform: scale(0.98); }
    #send:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      filter: none;
    }
  </style>
</head>
<body>
  <header>
    <h1>slimclaw</h1>
    <span>— agent chat</span>
  </header>

  <div id="messages"></div>

  <div id="input-area">
    <textarea id="input" placeholder="Type a message..." rows="1"></textarea>
    <button id="send">Send</button>
  </div>

  <script>
    const messagesEl = document.getElementById('messages');
    const inputEl = document.getElementById('input');
    const sendBtn = document.getElementById('send');

    let history = [];
    let pendingMessage = null;
    let isWaiting = false;

    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }

    function renderMarkdown(text) {
      if (typeof marked !== 'undefined') {
        return marked.parse(text, { breaks: true });
      }
      return escapeHtml(text).replace(/\n/g, '<br>');
    }

    function addMessage(role, content, isMarkdown = false) {
      const div = document.createElement('div');
      div.className = `msg ${role}`;
      const roleLabel = role === 'user' ? 'You' : 'Assistant';
      const contentEl = isMarkdown
        ? `<div class="content">${renderMarkdown(content)}</div>`
        : `<div class="content">${escapeHtml(content).replace(/\n/g, '<br>')}</div>`;
      div.innerHTML = `<div class="role">${roleLabel}</div>${contentEl}`;
      messagesEl.appendChild(div);
      messagesEl.scrollTop = messagesEl.scrollHeight;
    }

    function showThinking() {
      const div = document.createElement('div');
      div.className = 'thinking';
      div.id = 'thinking-elm';
      div.innerHTML = '<span class="dot">●</span><span class="dot">●</span><span class="dot">●</span> thinking...';
      messagesEl.appendChild(div);
      messagesEl.scrollTop = messagesEl.scrollHeight;
    }

    function hideThinking() {
      const el = document.getElementById('thinking-elm');
      if (el) el.remove();
    }

    function showShellConfirm(message, command) {
      const div = document.createElement('div');
      div.className = 'shell-confirm';
      div.id = 'shell-confirm-elm';
      const cmdEl = command ? `<code class="shell-cmd">${escapeHtml(command)}</code>` : '';
      div.innerHTML = `
        <div class="shell-confirm-text">
          <span>Run shell command?</span>
          ${cmdEl}
        </div>
        <div class="shell-confirm-btns">
          <button class="allow" data-allow="true">Yes</button>
          <button data-allow="false">No</button>
        </div>
      `;
      div.querySelectorAll('button').forEach(btn => {
        btn.onclick = () => {
          const allow = btn.dataset.allow === 'true';
          div.remove();
          sendMessage(message, allow);
        };
      });
      messagesEl.appendChild(div);
      messagesEl.scrollTop = messagesEl.scrollHeight;
    }

    async function sendMessage(text, shellConfirm = false) {
      if (!text.trim() || isWaiting) return;

      if (!shellConfirm) {
        addMessage('user', text);
        history.push({ role: 'user', content: text });
      }

      isWaiting = true;
      sendBtn.disabled = true;
      showThinking();

      try {
        const res = await fetch('/api/chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            message: text,
            history,
            shell_confirm: shellConfirm
          })
        });
        const data = await res.json();

        if (data.needs_shell_confirm) {
          hideThinking();
          showShellConfirm(text, data.shell_command || '(unknown command)');
          isWaiting = false;
          sendBtn.disabled = false;
          return;
        }

        hideThinking();
        addMessage('assistant', data.content, true);
        history.push({ role: 'assistant', content: data.content });
      } catch (err) {
        hideThinking();
        addMessage('assistant', `Error: ${err.message}`, false);
      } finally {
        isWaiting = false;
        sendBtn.disabled = false;
      }
    }

    sendBtn.onclick = () => {
      const text = inputEl.value.trim();
      if (text) {
        inputEl.value = '';
        sendMessage(text);
      }
    };

    inputEl.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        sendBtn.click();
      }
    });

    inputEl.addEventListener('input', () => {
      inputEl.style.height = 'auto';
      inputEl.style.height = Math.min(inputEl.scrollHeight, 160) + 'px';
    });
  </script>
</body>
</html>
