[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "slimclaw"
version = "0.1.0"
description = "A local-first AI agent CLI powered by Ollama"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "langchain-ollama",
    "langchain-openai",
    "langchain-anthropic",
    "langchain",
    "langchain-core",
    "langgraph",
    "langsmith",
    "ddgs",
    "rich",
    "python-dotenv",
]

[project.optional-dependencies]
dev = [
    "pre-commit",
    "ruff",
]

[project.scripts]
slimclaw = "slimclaw.cli.runner:main"

[tool.hatch.build.targets.wheel]
packages = ["src/slimclaw"]
