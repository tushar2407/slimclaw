name: Lint

on:
  pull_request:
    branches: [master]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Ruff
        run: pip install ruff

      - name: Run Ruff (check)
        run: ruff check .

      - name: Run Ruff (format check)
        run: ruff format --check .

      - name: Check paths are absolute
        # run: python scripts/lint_absolute_paths.py
